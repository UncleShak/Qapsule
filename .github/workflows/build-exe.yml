name: Build Windows installer

# Builds an unsigned Qapsule installer (NSIS) and uploads it as a downloadable
# artifact: on every push to the overhaul branch, or by hand from the Actions tab
# once this file is on main.
on:
  push:
    branches: [overhaul]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app and installer
        run: bun run tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: qapsule-windows-installer
          # Only the installer: a bare exe opened from a zip runs from a temporary
          # folder, and Start with Windows can't point at it.
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
