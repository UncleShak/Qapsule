[package]
name = "qapsule-providers"
description = "Qapsule's built-in data sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qapsule-protocol = { path = "../protocol" }
qapsule-server = { path = "../server" }
qapsule-core = { path = "../core" }
qapsule-secrets = { path = "../secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# Schannel on Windows: no OpenSSL and no rustls.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "query"] }
rrule = "0.14.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
notify = { version = "8", default-features = false }
# Wallpapers and Wallpaper Engine previews; only the formats they come in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "UI_ViewManagement",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
