[package]
name = "qapsule-providers"
description = "Qapsule's built-in data sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qapsule-protocol = { path = "../protocol" }
qapsule-server = { path = "../server" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
